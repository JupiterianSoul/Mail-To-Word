<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail to Word</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <h1>Mail to Word</h1>
        <p>Exporter facilement une conversation Gmail vers Word.</p>

        <form>
            <label for="email">Adresse e-mail du contact</label>
            <input id="email" name="email" type="email" placeholder="contact@example.com">

            <label for="format">Format d’export</label>
            <select id="format" name="format">
                <option value="docx">Word (.docx)</option>
                <option value="txt">Texte (.txt)</option>
                <option value="json">JSON (.json)</option>
            </select>

            <button type="submit">Rechercher les conversations</button>
        </form>
    </main>
</body>
</html>
